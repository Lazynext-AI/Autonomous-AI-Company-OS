<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; font-family: system-ui; background: #0A0A0B; color: #FAFAFA; }
  .p { padding: 14px 16px; }
  h1 { font-size: 14px; margin: 0 0 10px; } h1 span { color: #A78BFA; }
  .stat { display: flex; justify-content: space-between; font-size: 12px; color: #9C9CAA; padding: 5px 0; border-bottom: 1px solid #26262E; }
  .stat b { color: #FAFAFA; font-family: ui-monospace, monospace; }
  input, button { font-size: 12px; }
  input { width: 100%; box-sizing: border-box; background: #0E0E13; border: 1px solid #26262E; border-radius: 8px; padding: 8px 10px; color: #FAFAFA; margin-top: 10px; outline: none; }
  button { width: 100%; margin-top: 8px; background: #8B5CF6; border: none; color: #fff; font-weight: 700; padding: 8px; border-radius: 8px; cursor: pointer; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row a { flex: 1; text-align: center; font-size: 11px; color: #A78BFA; text-decoration: none; padding: 6px; border: 1px solid #26262E; border-radius: 8px; }
  #msg { font-size: 11px; color: #22C55E; margin-top: 8px; }
  .task { font-size: 11px; color: #9C9CAA; padding: 4px 0; border-bottom: 1px solid #1C1C22; }
</style>
</head>
<body>
<div class="p">
  <h1><span>◆</span> Lazynext</h1>
  <div id="stats">Loading…</div>
  <div id="tasks" style="margin-top:10px"></div>
  <input id="task" placeholder="Queue a task for the agents…">
  <button id="queue">Queue task</button>
  <div id="msg"></div>
  <div class="row">
    <a href="https://dashboard.lazynext.com" target="_blank">Dashboard</a>
    <a href="options.html" target="_blank">Settings</a>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
