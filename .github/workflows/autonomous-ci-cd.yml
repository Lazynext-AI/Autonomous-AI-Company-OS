name: Autonomous CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Python dependencies
        run: poetry install --no-interaction --no-root

      - name: Run test suite
        run: poetry run pytest tests/ -v

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - dashboard-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Railway deploy hook
        if: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}"

      - name: Trigger Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  verify-deploy:
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Verify deployed services
        env:
          API_HEALTH_URL: ${{ secrets.PROD_API_HEALTH_URL }}
          FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
        run: |
          set -euo pipefail

          if [ -z "${API_HEALTH_URL}" ] && [ -z "${FRONTEND_URL}" ]; then
            echo "No verification URLs configured. Skipping smoke tests."
            exit 0
          fi

          if [ -n "${API_HEALTH_URL}" ]; then
            echo "Checking API health..."
            api_ok=0
            for i in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w "%{http_code}" "${API_HEALTH_URL}")"
              if [ "${code}" = "200" ]; then
                api_ok=1
                break
              fi
              echo "API check ${i} failed with ${code}. Retrying in 15s."
              sleep 15
            done
            if [ "${api_ok}" -ne 1 ]; then
              echo "API health verification failed."
              exit 1
            fi
          fi

          if [ -n "${FRONTEND_URL}" ]; then
            echo "Checking frontend..."
            ui_ok=0
            for i in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w "%{http_code}" "${FRONTEND_URL}")"
              if [ "${code}" -lt 500 ]; then
                ui_ok=1
                break
              fi
              echo "Frontend check ${i} failed with ${code}. Retrying in 15s."
              sleep 15
            done
            if [ "${ui_ok}" -ne 1 ]; then
              echo "Frontend verification failed."
              exit 1
            fi
          fi

  open-rollback-issue:
    runs-on: ubuntu-latest
    needs:
      - verify-deploy
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Open rollback issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CRITICAL: Deployment verification failed - rollback required";
            const body = [
              "Deployment verification failed in CI/CD.",
              "Action required:",
              "1. Roll back to last known good release",
              "2. Validate API health and frontend availability",
              "3. Add regression test for the failure mode"
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["incident", "rollback", "autonomous-system"]
            });
