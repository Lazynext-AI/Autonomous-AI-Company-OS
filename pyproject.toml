[tool.poetry]
name = "lazynext"
version = "0.1.0"
description = "Autonomous AI Company Operating System - self-running organization of AI agents"
authors = ["Founder"]
readme = "README.md"
packages = [{include = "core"}, {include = "agents"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = "^0.30"
pydantic = "^2.8"
pydantic-settings = "^2.4"
structlog = "^24.4"
httpx = "^0.27"
playwright = "^1.47"
pytest = "^8.3"
pytest-asyncio = "^0.24"
python-dotenv = "^1.0"
PyGithub = "^2.4"
schedule = "^1.2"
rich = "^14.0"
sentence-transformers = "^2.7"
pypdf = "^5.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
