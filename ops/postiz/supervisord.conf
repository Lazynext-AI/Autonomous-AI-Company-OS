[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# postgres is started by /entrypoint.sh (initdb/restore need to run first)
# — supervisord owns redis, temporal, postiz, and the backup loop.

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --appendonly yes --dir /data/redis
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:temporal]
command=/bin/bash /etc/temporal/entrypoint.sh autosetup
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postiz]
command=/opt/postiz-run.sh
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backup]
command=/bin/bash -c "sleep 300; while true; do /opt/backup.sh; sleep 900; done"
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
