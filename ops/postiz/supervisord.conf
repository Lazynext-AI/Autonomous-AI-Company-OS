[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# postgres is started by /entrypoint.sh (initdb/restore need to run first)
# — supervisord owns redis, temporal, postiz, and the backup loop.

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --appendonly yes --dir /data/redis
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:elasticsearch]
# ES single-node dev mode: loopback only, 256MB heap, no xpack auth.
# loopback bind keeps bootstrap checks as warnings (vm.max_map_count etc.)
directory=/usr/share/elasticsearch
user=elasticsearch
command=/usr/share/elasticsearch/bin/elasticsearch -E network.host=127.0.0.1 -E discovery.type=single-node -E xpack.security.enabled=false -E path.data=/data/es -E path.logs=/data/es-logs -E cluster.routing.allocation.disk.threshold_enabled=false
environment=ES_JAVA_OPTS="-Xms256m -Xmx256m"
autorestart=true
priority=15
startsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:temporal]
# the CLI + dockerize resolve "config" relative to cwd — must be /etc/temporal
directory=/etc/temporal
command=/bin/bash /etc/temporal/entrypoint.sh autosetup
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postiz]
directory=/app
command=/opt/postiz-run.sh
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:heartbeat]
# refresh an R2 marker every 60s — tells us the container is alive on CF even
# when observability shows nothing (provisioning-stage kills emit no stdout)
command=/bin/bash -c 'while true; do RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" RCLONE_CONFIG_R2_REGION=auto RCLONE_CONFIG_R2_ACL=private rclone --contimeout 10s --timeout 20s --retries 1 rcat "r2:${R2_BUCKET:-lazynext-media}/postiz-boot/heartbeat-$(hostname).txt" <<< "$(date -Iseconds)" 2>/dev/null; sleep 60; done'
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backup]
command=/bin/bash -c "sleep 300; while true; do /opt/backup.sh; sleep 900; done"
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
