[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
pidfile=/run/supervisord.pid

# postgres is started by /opt/entrypoint.sh (initdb/restore need to run first)
# — supervisord owns redis, temporal, postiz, and the backup loop.
# All logs go to real files under /data/logs (CF containers have no usable
# stdout device) and logship uploads them to R2 every 30s for debugging.

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --appendonly yes --dir /data/redis
autorestart=true
priority=10
stdout_logfile=/data/logs/redis.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/data/logs/redis.err.log
stderr_logfile_maxbytes=5MB

[program:elasticsearch]
# ES single-node dev mode: loopback only, 256MB heap, no xpack auth.
# loopback bind keeps bootstrap checks as warnings (vm.max_map_count etc.)
directory=/usr/share/elasticsearch
user=elasticsearch
command=/usr/share/elasticsearch/bin/elasticsearch -E network.host=127.0.0.1 -E discovery.type=single-node -E xpack.security.enabled=false -E path.data=/data/es -E path.logs=/data/es-logs -E cluster.routing.allocation.disk.threshold_enabled=false
environment=ES_JAVA_OPTS="-Xms256m -Xmx256m"
autorestart=true
priority=15
startsecs=20
stdout_logfile=/data/logs/es.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/data/logs/es.err.log
stderr_logfile_maxbytes=5MB

[program:temporal]
# the CLI + dockerize resolve "config" relative to cwd — must be /etc/temporal
directory=/etc/temporal
command=/bin/bash /etc/temporal/entrypoint.sh autosetup
autorestart=true
priority=20
stdout_logfile=/data/logs/temporal.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/data/logs/temporal.err.log
stderr_logfile_maxbytes=5MB

[program:postiz]
directory=/app
command=/opt/postiz-run.sh
autorestart=true
priority=30
stdout_logfile=/data/logs/postiz.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/data/logs/postiz.err.log
stderr_logfile_maxbytes=5MB

[program:heartbeat]
# refresh an R2 marker every 60s — tells us the container is alive on CF even
# when observability shows nothing (provisioning-stage kills emit no stdout)
command=/bin/bash -c 'while true; do RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" RCLONE_CONFIG_R2_REGION=auto RCLONE_CONFIG_R2_ACL=private rclone --contimeout 10s --timeout 20s --retries 1 rcat "r2:${R2_BUCKET:-lazynext-media}/postiz-boot/heartbeat-$(hostname).txt" <<< "$(date -Iseconds)" 2>/dev/null; sleep 60; done'
autorestart=true
priority=50
stdout_logfile=/data/logs/heartbeat.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/data/logs/heartbeat.err.log
stderr_logfile_maxbytes=1MB

[program:logship]
# ship service logs to R2 — the only reliable way to see inside on CF
command=/bin/bash -c 'while true; do sleep 30; tar -czf /tmp/logs.tgz -C /data logs 2>/dev/null && RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" RCLONE_CONFIG_R2_REGION=auto RCLONE_CONFIG_R2_ACL=private rclone --contimeout 10s --timeout 60s --retries 1 copyto /tmp/logs.tgz "r2:${R2_BUCKET:-lazynext-media}/postiz-boot/logs-$(hostname).tgz" 2>/dev/null; done'
autorestart=true
priority=45
stdout_logfile=/data/logs/logship.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/data/logs/logship.err.log
stderr_logfile_maxbytes=1MB

[program:backup]
command=/bin/bash -c "sleep 300; while true; do /opt/backup.sh; sleep 900; done"
autorestart=true
priority=40
stdout_logfile=/data/logs/backup.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/data/logs/backup.err.log
stderr_logfile_maxbytes=1MB
