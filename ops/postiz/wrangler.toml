name = "postiz-stack"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
# wrangler builds Dockerfile and pushes to the CF registry on deploy.
# To skip the local build, pin a pushed digest instead:
#   image = "registry.cloudflare.com/85953070bae00da372951a8833bd3459/postiz-stack-postizstack@sha256:673625167dad03c6a72a5bd1d78e4809a578a6d44ab4221e35468715f34d75e7"
image = "registry.cloudflare.com/85953070bae00da372951a8833bd3459/postiz-stack-postizstack@sha256:673625167dad03c6a72a5bd1d78e4809a578a6d44ab4221e35468715f34d75e7"
class_name = "PostizStack"
max_instances = 1
# fat stack: postgres + redis + temporal + node — dev/lite OOM instantly.
instance_type = "standard-4"
constraints = { tiers = [1, 2, 3, 4] }
observability = { enabled = true }

[[durable_objects.bindings]]
name = "POSTIZ"
class_name = "PostizStack"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PostizStack"]
