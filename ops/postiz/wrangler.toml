name = "postiz-stack"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
# wrangler builds Dockerfile and pushes to the CF registry on deploy.
# To skip the local build, pin a pushed digest instead:
#   image = "registry.cloudflare.com/85953070bae00da372951a8833bd3459/postiz-stack-postizstack@sha256:c9c55f1d909bbbcfcfa673fc8932e2b9cc46105bcf23b319ee51ba917db20840"
image = "registry.cloudflare.com/85953070bae00da372951a8833bd3459/postiz-stack-postizstack@sha256:c9c55f1d909bbbcfcfa673fc8932e2b9cc46105bcf23b319ee51ba917db20840"
class_name = "PostizStack"
max_instances = 1
# fat stack: postgres + redis + temporal + node — dev/lite OOM instantly.
instance_type = "standard-4"
constraints = { tiers = [1, 2, 3, 4] }
observability = { enabled = true }

[[durable_objects.bindings]]
name = "POSTIZ"
class_name = "PostizStack"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PostizStack"]
