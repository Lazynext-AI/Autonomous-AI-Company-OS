name = "ai-company-os"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "ai-company-db"
database_id = "a1c3a62f-96e0-4b1f-86eb-c0de063c9ee0"

[[kv_namespaces]]
binding = "EPHEMERAL"
id = "15bccb97f4aa4f9c8c1a1b97b54a558f"

[[vectorize]]
binding = "VECTORS"
index_name = "company-knowledge"

# Workers AI — free-tier Llama model as a stand-in brain until Atlas is funded.
[ai]
binding = "AI"

# Browser Rendering — headless Chromium for page scraping (replaces Firecrawl).
[browser]
binding = "BROWSER"

# Code-execution container — Python sandbox replacing E2B.
[[containers]]
name = "code-exec"
class_name = "CodeExecContainer"
image = "./Dockerfile"
max_instances = 5

[[durable_objects.bindings]]
name = "CODE_EXEC"
class_name = "CodeExecContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CodeExecContainer"]

# Continuous agent loop — cron fires agentTick every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

# Shared bearer token between Python agents/dashboard and this Worker.
# Set with: npx wrangler secret put API_TOKEN
