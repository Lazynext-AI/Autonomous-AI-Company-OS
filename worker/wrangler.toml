name = "ai-company-os"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[vars]
# Cloudflare account for deploying the company's product worker.
CF_ACCOUNT_ID = "85953070bae00da372951a8833bd3459"

[[d1_databases]]
binding = "DB"
database_name = "ai-company-db"
database_id = "a1c3a62f-96e0-4b1f-86eb-c0de063c9ee0"

[[kv_namespaces]]
binding = "EPHEMERAL"
id = "15bccb97f4aa4f9c8c1a1b97b54a558f"

[[vectorize]]
binding = "VECTORS"
index_name = "company-knowledge"

# Workers AI — free-tier Llama model — the agent brain.
[ai]
binding = "AI"

# Browser Rendering — headless Chromium for page scraping (for agent research).
[browser]
binding = "BROWSER"

# Product worker — scheduled monitor rescans call its /scan via service binding
# (same-account workers.dev fetches are refused by the runtime).
[[services]]
binding = "A11Y"
service = "accessibility-checker"

# Code-execution container — Python sandbox for agent code execution.
# The [[containers]] stanza must stay uncommented: deploying without it drops
# the DO-class container association and /exec 500s with "Containers have not
# been enabled for this Durable Object class". Requires a running local docker
# daemon at deploy time — if docker is down, don't deploy this worker.
[[containers]]
name = "code-exec"
class_name = "CodeExecContainer"
image = "./Dockerfile"
max_instances = 5

[[durable_objects.bindings]]
name = "CODE_EXEC"
class_name = "CodeExecContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CodeExecContainer"]

# Social-post dispatch — D1 social_posts is the source of truth; the queue is
# the delivery layer (second-precision delaySeconds vs ±10min cron latency,
# per-message redelivery, DLQ for exhausted infra retries). The cron sweep in
# dispatchScheduledPosts stays as the cold-path enqueuer (run_at > 12h can't
# delaySeconds) and the safety net for lost sends.
[[queues.producers]]
binding = "SOCIAL_QUEUE"
queue = "social-posts"

[[queues.consumers]]
queue = "social-posts"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 8
dead_letter_queue = "social-posts-dlq"

# Continuous agent loop — cron fires agentTick every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

# Shared bearer token between Python agents/dashboard and this Worker.
# Set with: npx wrangler secret put API_TOKEN
